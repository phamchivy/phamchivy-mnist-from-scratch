version: "3.9"
services:
  stage1:
    build: .
    command: ./app_pipeline stage1 12345 12346
    deploy:
      resources:
        limits:
          cpus: "2.0"
    cpuset: "0-1"
    networks:
      pipeline_net:
        ipv4_address: 172.32.0.2
    volumes:
      - ./data:/app/data:ro
    restart: "no"

  stage2:
    build: .
    command: ./app_pipeline stage2 12345 12346 172.32.0.2
    deploy:
      resources:
        limits:
          cpus: "2.0"
    cpuset: "2-3"
    depends_on:
      - stage1
    networks:
      pipeline_net:
        ipv4_address: 172.32.0.3
    volumes:
      - ./data:/app/data:ro
    restart: "no"

  coordinator:
    build: .
    command: ./app_pipeline coordinator 12345 12346
    deploy:
      resources:
        limits:
          cpus: "1.0"
    cpuset: "4"
    depends_on:
      - stage1
      - stage2
    networks:
      pipeline_net:
        ipv4_address: 172.32.0.4
    restart: on-failure

networks:
  pipeline_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16 