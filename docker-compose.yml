version: "3.9"
services:
  parameter_server:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.server
    command: ["config.yml"]  # Pass config file as argument
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    cpuset: "0"
    ports:
      - "${SERVER_PORT:-12345}:${SERVER_PORT:-12345}"
    volumes:
      - ./config/config.yml:/app/config.yml:ro  # Mount config file
      - ./results/async_server_logs:/app/async_server_logs
      - ./logs:/app/logs
      - /dev/shm:/dev/shm:rw  # ✅ Shared memory for async communication
    networks:
      hybrid_net:
        ipv4_address: 172.32.0.10
    environment:
      - CONFIG_FILE=config.yml

  # Pipeline Group 1 (Data 0-29999)
  worker1_stage1:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.worker_stage1
    command: ["config.yml", "1", "172.32.0.12", "13001", "172.32.0.10", "${SERVER_PORT:-12345}"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "1G"
    cpuset: "1-2"
    depends_on:
      - parameter_server
      - worker1_stage2
    volumes:
      - ./config/config.yml:/app/config.yml:ro
      - ./results/async_worker1_stage1:/app/async_stage1_group_1
      - ./logs:/app/logs
      - /dev/shm:/dev/shm:rw  # ✅ Shared memory
    networks:
      hybrid_net:
        ipv4_address: 172.32.0.11
    restart: on-failure
    environment:
      - CONFIG_FILE=config.yml
      - WORKER_GROUP=1
      - WORKER_STAGE=1
      - SHARED_MEMORY_KEY=/async_pipeline_group_1

  worker1_stage2:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.worker_stage2
    command: ["config.yml", "1", "13001", "172.32.0.10", "${SERVER_PORT:-12345}"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "1G"
    cpuset: "3-4"
    depends_on:
      - parameter_server
    volumes:
      - ./config/config.yml:/app/config.yml:ro
      - ./results/async_worker1_stage2:/app/async_stage2_group_1
      - ./logs:/app/logs
      - /dev/shm:/dev/shm:rw  # ✅ Shared memory
    networks:
      hybrid_net:
        ipv4_address: 172.32.0.12
    ports:
      - "13001:13001"
    restart: on-failure
    environment:
      - CONFIG_FILE=config.yml
      - WORKER_GROUP=1
      - WORKER_STAGE=2
      - SHARED_MEMORY_KEY=/async_pipeline_group_1

  # Pipeline Group 2 (Data 30000-59999)
  worker2_stage1:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.worker_stage1
    command: ["config.yml", "2", "172.32.0.14", "13002", "172.32.0.10", "${SERVER_PORT:-12345}"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
    cpuset: "5"
    depends_on:
      - parameter_server
      - worker2_stage2
    volumes:
      - ./config/config.yml:/app/config.yml:ro
      - ./results/async_worker2_stage1:/app/async_stage1_group_2
      - ./logs:/app/logs
      - /dev/shm:/dev/shm:rw
    networks:
      hybrid_net:
        ipv4_address: 172.32.0.13
    restart: on-failure
    environment:
      - CONFIG_FILE=config.yml
      - WORKER_GROUP=2
      - WORKER_STAGE=1
      - SHARED_MEMORY_KEY=/async_pipeline_group_2

  worker2_stage2:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.worker_stage2
    command: ["config.yml", "2", "13002", "172.32.0.10", "${SERVER_PORT:-12345}"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
    cpuset: "6"
    depends_on:
      - parameter_server
    volumes:
      - ./config/config.yml:/app/config.yml:ro
      - ./results/async_worker2_stage2:/app/async_stage2_group_2
      - ./logs:/app/logs
      - /dev/shm:/dev/shm:rw
    networks:
      hybrid_net:
        ipv4_address: 172.32.0.14
    ports:
      - "13002:13002"
    restart: on-failure
    environment:
      - CONFIG_FILE=config.yml
      - WORKER_GROUP=2
      - WORKER_STAGE=2
      - SHARED_MEMORY_KEY=/async_pipeline_group_2

  # Optional: Config validator service
  # config_validator:
  #   build:
  #     context: .
  #     dockerfile: dockerfiles/Dockerfile.server  # Reuse server image
  #   command: ["./test_config", "config.yml"]
  #   volumes:
  #     - ./config/config.yml:/app/config.yml:ro
  #     - ./logs:/app/logs
  #   networks:
  #     hybrid_net:
  #   profiles: ["validate"]  # Only run when explicitly requested

networks:
  hybrid_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/16