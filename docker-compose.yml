version: "3.9"
services:
  master:
    build: .
    command: ./app master 12345
    deploy:
      resources:
        limits:
          cpus: "4.0"
    cpuset: "0-3"
    volumes:
      - ./testing_net_master:/app/testing_net  # <-- Mount vào đây
    networks:
      train_net:
        ipv4_address: 172.31.0.2

  slaver:
    build: .
    command: ./app slaver 12345 172.31.0.2
    deploy:
      resources:
        limits:
          cpus: "4.0"
    cpuset: "4-7"
    depends_on:
      - master
    networks:
      train_net:
        ipv4_address: 172.31.0.3
    restart: on-failure

networks:
  train_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16